<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>実験データ管理</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="app-header">
    <div>
      <h1>実験データ管理</h1>
      <p>入力データはこの端末内に保存されます。</p>
    </div>
    <div id="stepIndicator" class="step-indicator">Step 1 / 3</div>
  </header>

  <section id="stepCommon" class="screen active">
    <div class="card">
      <h2>① 共通情報</h2>
      <label>年月日<input type="date" id="commonDate"></label>
      <label>EXP No.<input type="text" id="commonExpNo" placeholder="例：EXP-12"></label>

      <fieldset><legend>水</legend>
        <div class="segmented" data-group="water">
          <button type="button" data-value="">未選択</button>
          <button type="button" data-value="交換済み">交換済み</button>
          <button type="button" data-value="未交換">未交換</button>
        </div>
      </fieldset>

      <fieldset><legend>餌</legend>
        <div class="segmented" data-group="food">
          <button type="button" data-value="">未選択</button>
          <button type="button" data-value="追加済み">追加済み</button>
          <button type="button" data-value="未追加">未追加</button>
        </div>
      </fieldset>

      <fieldset><legend>床敷き</legend>
        <div class="segmented" data-group="bedding">
          <button type="button" data-value="">未選択</button>
          <button type="button" data-value="交換済み">交換済み</button>
          <button type="button" data-value="未交換">未交換</button>
        </div>
      </fieldset>

      <label>共通備考<textarea id="commonMemo" rows="4" placeholder="必要なときだけ入力"></textarea></label>
      <button type="button" id="toMeasurement">次へ：計測</button>
    </div>
  </section>

  <section id="stepMeasurement" class="screen">
    <div class="card">
      <div class="screen-title-row">
        <div>
          <h2>② 計測</h2>
          <p id="measurementCageProgress"></p>
        </div>
        <button type="button" class="small secondary" id="addCageMeasurement">＋ ケージ追加</button>
      </div>

      <div class="cage-header">
        <label>ケージ番号
          <input type="number" inputmode="numeric" id="measurementCageNumber">
        </label>
        <button type="button" class="small secondary" id="addAnimalMeasurement">＋ このケージに個体追加</button>
      </div>

      <p class="hint">個体1で「測定者」「計測記録者」を選ぶと、未入力の個体へ自動反映します。個体ごとに後から変更できます。</p>

      <div id="measurementAnimals"></div>

      <div class="nav-row">
        <button type="button" class="secondary" id="measurementPrevCage">← 前のケージ</button>
        <button type="button" class="secondary" id="measurementNextCage">次のケージ →</button>
      </div>

      <button type="button" id="toDosing">計測を終えて投与へ</button>
      <button type="button" class="secondary" id="backToCommon">← 共通情報に戻る</button>
    </div>
  </section>

  <section id="stepDosing" class="screen">
    <div class="card">
      <h2>③ 投与</h2>
      <p id="dosingCageProgress"></p>
      <div class="animal-summary" id="dosingCageSummary"></div>

      <p class="hint">個体1で「投与部位」を選ぶと、未入力の個体へ自動反映します。個体ごとに後から変更できます。</p>

      <div id="dosingAnimals"></div>

      <div class="nav-row">
        <button type="button" class="secondary" id="dosingPrevCage">← 前のケージ</button>
        <button type="button" class="secondary" id="dosingNextCage">次のケージ →</button>
      </div>

      <button type="button" id="saveDay">この日のデータを保存</button>
      <button type="button" class="secondary" id="backToMeasurement">← 計測に戻る</button>
    </div>
  </section>

  <section class="card">
    <h2>保存済みデータ</h2>
    <div class="actions">
      <button type="button" id="csvButton" class="secondary">CSV出力（Excel用）</button>
      <button type="button" id="backupButton" class="secondary">バックアップ出力</button>
      <label class="file-label">バックアップ読込<input type="file" id="restoreInput" accept=".json,application/json"></label>
    </div>
    <div class="table-wrapper">
      <table>
        <thead><tr>
          <th>年月日</th><th>EXP No.</th><th>ケージ</th><th>色</th>
          <th>右厚</th><th>右幅</th><th>左厚</th><th>左幅</th><th>体重</th><th>投与</th><th></th>
        </tr></thead>
        <tbody id="savedTable"></tbody>
      </table>
    </div>
  </section>
</main>

<template id="measurementAnimalTemplate">
  <div class="animal-card">
    <div class="animal-title-row">
      <h3 class="animal-title"></h3>
      <button type="button" class="small danger-outline remove-animal">削除</button>
    </div>

    <label>色
      <select class="m-color">
        <option value="">未選択</option>
        <option value="無印">無印</option>
        <option value="赤">赤</option>
        <option value="青">青</option>
        <option value="緑">緑</option>
        <option value="橙">橙</option>
      </select>
    </label>

    <label>感染週数<input type="number" inputmode="numeric" class="m-weeks"></label>

    <div class="grid2">
      <label>測定者
        <select class="m-measurer person-select"></select>
      </label>
      <label>計測記録者
        <select class="m-recorder person-select"></select>
      </label>
    </div>

    <label>計測時イソフルラン量
      <div class="unit-input"><input type="number" inputmode="numeric" step="1" class="m-iso-measure"><span>µL</span></div>
    </label>

    <div class="grid2">
      <label>右足厚さ<div class="unit-input"><input type="number" inputmode="decimal" step="0.01" class="m-r-thick"><span>mm</span></div></label>
      <label>右足幅<div class="unit-input"><input type="number" inputmode="decimal" step="0.01" class="m-r-width"><span>mm</span></div></label>
      <label>左足厚さ<div class="unit-input"><input type="number" inputmode="decimal" step="0.01" class="m-l-thick"><span>mm</span></div></label>
      <label>左足幅<div class="unit-input"><input type="number" inputmode="decimal" step="0.01" class="m-l-width"><span>mm</span></div></label>
    </div>

    <label>体重<div class="unit-input"><input type="number" inputmode="decimal" step="0.01" class="m-weight"><span>g</span></div></label>
    <label>計測備考<textarea rows="3" class="m-memo" placeholder="必要なときだけ入力"></textarea></label>
  </div>
</template>

<template id="dosingAnimalTemplate">
  <div class="animal-card">
    <h3 class="animal-title"></h3>
    <div class="mini-summary"></div>

    <fieldset><legend>投与</legend>
      <div class="segmented dosing-presence">
        <button type="button" data-value="">未選択</button>
        <button type="button" data-value="あり">あり</button>
        <button type="button" data-value="なし">なし</button>
      </div>
    </fieldset>

    <div class="dosing-fields"></div>
    <label>投与備考<textarea rows="3" class="d-memo" placeholder="必要なときだけ入力"></textarea></label>
  </div>
</template>

<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js").catch(console.error));
}
</script>
</body>
</html>
