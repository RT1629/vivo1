<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>実験データ管理</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>

  <div class="container">

    <h1>実験データ管理</h1>

    <label>
      日付
      <input type="date" id="date">
    </label>

    <label>
      ケージ
      <input type="number" id="cage">
    </label>

    <label>
      Lot
      <input type="text" id="lot" placeholder="例：赤 OA">
    </label>

    <label>
      Control
      <input type="number" step="0.01" id="control">
    </label>

    <label>
      感染側
      <input type="number" step="0.01" id="infection">
    </label>

    <label>
      体重
      <input type="number" step="0.01" id="weight">
    </label>

    <label>
      <input type="checkbox" id="water">
      水替え
    </label>

    <label>
      <input type="checkbox" id="food">
      餌
    </label>

    <label>
      <input type="checkbox" id="bedding">
      床敷き
    </label>

    <label>
      備考
      <textarea id="memo"></textarea>
    </label>

    <button id="saveButton">
      保存
    </button>

    <button id="csvButton">
      CSV出力
    </button>

    <h2>保存済みデータ</h2>

    <div class="table-wrapper">

      <table>

        <thead>
          <tr>
            <th>日付</th>
            <th>ケージ</th>
            <th>Lot</th>
            <th>Control</th>
            <th>感染側</th>
            <th>体重</th>
            <th>水替え</th>
            <th>餌</th>
            <th>床敷き</th>
            <th>備考</th>
          </tr>
        </thead>

        <tbody id="dataTable">
        </tbody>

      </table>

    </div>

  </div>

  <script src="app.js"></script>
<script src="app.js"></script>

<script>

if ("serviceWorker" in navigator) {

  navigator.serviceWorker.register(
    "service-worker.js"
  );

}

</script>

</body>
</html>
